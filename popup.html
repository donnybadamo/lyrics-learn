<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px;
      color: #1db954;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      color: #b3b3b3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    #vocab-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
    }
    .vocab-item {
      padding: 6px 0;
      border-bottom: 1px solid #282828;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vocab-item:last-child { border-bottom: none; }
    .vocab-remove {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
    }
    .vocab-remove:hover { color: #e91429; }
    .empty-state {
      color: #b3b3b3;
      font-size: 13px;
      padding: 12px 0;
    }
    #clear-vocab {
      margin-top: 8px;
      padding: 8px 12px;
      background: #282828;
      border: none;
      border-radius: 4px;
      color: #b3b3b3;
      font-size: 12px;
      cursor: pointer;
    }
    #clear-vocab:hover {
      background: #333;
      color: #fff;
    }
    .tip {
      font-size: 11px;
      color: #535353;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #282828;
    }
  </style>
</head>
<body>
  <h1>Lyrics Learn Spanish</h1>
  <div class="section">
    <div class="section-title">Saved vocabulary</div>
    <div id="vocab-list"></div>
    <button id="clear-vocab">Clear all</button>
  </div>
  <div class="tip">
    Play Spanish songs on Spotify, open lyrics (mic icon), and click any word for definition + save.
  </div>
  <script src="popup.js"></script>
</body>
</html>
